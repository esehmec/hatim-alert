monitor:
  url: https://herkul.app/ortak-kuran
  threshold: 15
  start-time: "01:00"
  end-time: "23:50"
  interval: 1h
  fast-check:
    min-pages: 15
    max-pages: 100
    interval: 15m
    max-reminders: 3
playwright:
  headless: true
notification:
  to: ${MAIL_USERNAME}
mail:
  enabled: true
spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    debug: true
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true